services:
  postgres:
    image: postgres:16
    container_name: arfi-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: arfi_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arfi_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - arfi_pg_data:/var/lib/postgresql/data
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: arfi_test
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ppassword --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  arfi_pg_data:
