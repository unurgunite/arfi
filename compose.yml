services:
  postgres:
    image: postgres:16
    container_name: arfi-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: arfi_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arfi_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - arfi_pg_data:/var/lib/postgresql/data

volumes:
  arfi_pg_data:
