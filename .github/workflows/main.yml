name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: RuboCop
        run: bundle exec rubocop

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Steep
        run: |
          bundle exec rbs collection install
          bundle exec steep check

  docs:
    name: Check docs with Docscribe gem
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Check docs
        run: bundle exec docscribe --check lib spec

  test:
    name: Tests (matrix)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arfi_test
        options: >-
          --health-cmd "pg_isready -U postgres -d arfi_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30

      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: arfi_test
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword --silent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "2.7"
            gemfile: gemfiles/rails_6_0.gemfile
          - ruby: "3.0"
            gemfile: gemfiles/rails_6_1.gemfile
          - ruby: "3.1"
            gemfile: gemfiles/rails_7_0.gemfile
          - ruby: "3.2"
            gemfile: gemfiles/rails_7_1.gemfile
          - ruby: "3.3"
            gemfile: gemfiles/rails_7_2.gemfile
          - ruby: "3.4"
            gemfile: gemfiles/rails_8_0.gemfile
          - ruby: "4.0"
            gemfile: gemfiles/rails_8_1.gemfile

    env:
      ARFI_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/arfi_test
      ARFI_MYSQL_URL: mysql2://root:password@127.0.0.1:3306/arfi_test
      TRILOGY_RAILS: >-
        ${{ contains(matrix.gemfile, 'rails_7_1')
            || contains(matrix.gemfile, 'rails_7_2')
            || contains(matrix.gemfile, 'rails_8_0')
            || contains(matrix.gemfile, 'rails_8_1') }}

    steps:
      - uses: actions/checkout@v4

      - name: Install native deps (mysql2, pg)
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev postgresql-client

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Install bundle for Rails Gemfile
        env:
          BUNDLE_GEMFILE: ${{ matrix.gemfile }}
        run: |
          bundle config set path vendor/bundle
          bundle check || bundle install

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -U postgres -d arfi_test && exit 0
            sleep 1
          done
          echo "Postgres did not become ready" >&2
          exit 1

      - name: Wait for MySQL
        run: |
          for i in {1..60}; do
            mysqladmin ping -h 127.0.0.1 -ppassword --silent && exit 0
            sleep 1
          done
          echo "MySQL did not become ready" >&2
          exit 1

      - name: Make MySQL root Trilogy-compatible
        if: env.TRILOGY_RAILS == 'true'
        run: |
          mysql -h 127.0.0.1 -uroot -ppassword -e "
            ALTER USER 'root'@'%' IDENTIFIED WITH mysql_native_password BY 'password';
            FLUSH PRIVILEGES;
          "

      - name: Verify Trilogy connection works
        if: env.TRILOGY_RAILS == 'true'
        env:
          BUNDLE_GEMFILE: ${{ matrix.gemfile }}
          ARFI_MYSQL_URL: trilogy://root:password@127.0.0.1:3306/arfi_test
        run: |
          bundle exec ruby -e 'require "active_record";
          ActiveRecord::Base.establish_connection(ENV.fetch("ARFI_MYSQL_URL"));
          ActiveRecord::Base.connection.select_value("SELECT 1")'

      - name: Run specs
        env:
          BUNDLE_GEMFILE: ${{ matrix.gemfile }}
        run: bundle exec rspec

      - name: Run Trilogy adapter specs
        if: env.TRILOGY_RAILS == 'true'
        env:
          BUNDLE_GEMFILE: ${{ matrix.gemfile }}
          ARFI_MYSQL_URL: trilogy://root:password@127.0.0.1:3306/arfi_test
        run: bundle exec rspec --tag mysql

  test_mariadb:
    name: Tests (MariaDB)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ports: [ "5432:5432" ]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arfi_test
        options: >-
          --health-cmd "pg_isready -U postgres -d arfi_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30

      mariadb:
        image: mariadb:11
        ports: [ "3307:3306" ]
        env:
          MARIADB_ROOT_PASSWORD: password
          MARIADB_DATABASE: arfi_test
        options: >-
          --health-cmd="mariadb-admin ping -uroot -ppassword --silent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "3.4"
            gemfile: gemfiles/rails_8_1.gemfile

    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
      ARFI_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/arfi_test
      ARFI_MYSQL_URL: mysql2://root:password@127.0.0.1:3307/arfi_test

    steps:
      - uses: actions/checkout@v4

      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client mariadb-client

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Install bundle
        run: bundle check || bundle install

      - name: Wait for MariaDB
        run: |
          for i in {1..60}; do
            mariadb-admin ping -h 127.0.0.1 -P 3307 -uroot -ppassword --silent && exit 0
            sleep 1
          done
          echo "MariaDB did not become ready" >&2
          exit 1

      - name: Run specs
        run: bundle exec rspec
