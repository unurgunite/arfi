name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  lint_typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: RuboCop
        run: bundle exec rubocop

      - name: Steep
        run: |
          bundle exec rbs collection install
          bundle exec steep check

  test:
    name: Tests (matrix)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arfi_test
        options: >-
          --health-cmd "pg_isready -U postgres -d arfi_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30

      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: arfi_test
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword --silent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "2.7"
            gemfile: gemfiles/rails_6_0.gemfile
          - ruby: "3.0"
            gemfile: gemfiles/rails_6_1.gemfile
          - ruby: "3.1"
            gemfile: gemfiles/rails_7_0.gemfile
          - ruby: "3.2"
            gemfile: gemfiles/rails_7_1.gemfile
          - ruby: "3.3"
            gemfile: gemfiles/rails_7_2.gemfile
          - ruby: "3.4"
            gemfile: gemfiles/rails_8_0.gemfile
          - ruby: "4.0"
            gemfile: gemfiles/rails_8_1.gemfile

    env:
      ARFI_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arfi_test
      ARFI_MYSQL_URL: mysql2://root:password@127.0.0.1:3306/arfi_test

    steps:
      - uses: actions/checkout@v4

      - name: Install native deps (mysql2)
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Install bundle for Rails Gemfile
        env:
          BUNDLE_GEMFILE: ${{ matrix.gemfile }}
        run: |
          bundle config set path vendor/bundle
          bundle check || bundle install

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -U postgres -d arfi_test && exit 0
            sleep 1
          done
          echo "Postgres did not become ready" >&2
          exit 1

      - name: Wait for MySQL
        run: |
          for i in {1..60}; do
            mysqladmin ping -h 127.0.0.1 -ppassword --silent && exit 0
            sleep 1
          done
          echo "MySQL did not become ready" >&2
          exit 1

      - name: Run specs
        env:
          BUNDLE_GEMFILE: ${{ matrix.gemfile }}
        run: bundle exec rspec
